version: 2

models:
  - name: stg_ad_spots_linear
    description: "Linear TV ad spot bookings and delivery actuals. Grain: 1 row per spot_id."
    columns:
      - name: spot_id
        description: "Unique identifier for the linear ad spot."
        tests:
          - not_null
          - unique
      - name: campaign_id
        description: "Reference to the advertising campaign this spot belongs to."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ad_campaigns')
                field: campaign_id
      - name: broadcast_date
        description: "Date on which the ad spot aired."
        tests:
          - not_null
      - name: airing_time
        description: "Timestamp of when the ad spot aired."
      - name: channel_id
        description: "Reference to the channel on which the spot aired."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_channels')
                field: channel_id
      - name: daypart
        description: "Named daypart in which the spot aired (e.g. breakfast, peak)."
      - name: duration_sec
        description: "Duration of the ad spot in seconds."
      - name: booked_impressions_thousands
        description: "Booked audience impressions in thousands."
      - name: delivered_impressions_thousands
        description: "Delivered audience impressions in thousands."
      - name: rate_card_cpm_gbp
        description: "Rate card cost per thousand impressions in GBP."
      - name: actual_revenue_gbp
        description: "Actual revenue recognised for this spot in GBP."
        tests:
          - not_null
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_ad_spots_avod
    description: "AVOD (streaming) ad impression records from MediaCo Streaming. Grain: 1 row per impression_id."
    columns:
      - name: impression_id
        description: "Unique identifier for the AVOD ad impression."
        tests:
          - not_null
          - unique
      - name: campaign_id
        description: "Reference to the advertising campaign this impression belongs to."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ad_campaigns')
                field: campaign_id
      - name: play_event_id
        description: "Reference to the play event during which this impression was served."
      - name: served_at
        description: "Timestamp when the ad impression was served."
        tests:
          - not_null
      - name: programme_id
        description: "Reference to the programme during which this ad was served."
        tests:
          - relationships:
              arguments:
                to: ref('stg_programmes')
                field: programme_id
      - name: ad_position
        description: "Position of the ad within the ad break (e.g. pre-roll, mid-roll)."
      - name: device_type
        description: "Type of device on which the impression was served."
      - name: revenue_gbp
        description: "Revenue generated by this impression in GBP."
        tests:
          - not_null
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_advertisers
    description: "Advertiser reference data. Grain: 1 row per advertiser_id."
    columns:
      - name: advertiser_id
        description: "Unique identifier for the advertiser."
        tests:
          - not_null
          - unique
      - name: advertiser_name
        description: "Cleaned advertiser name (trimmed)."
        tests:
          - not_null
      - name: sector
        description: "Industry sector of the advertiser (lowercased and trimmed)."
        tests:
          - not_null
      - name: agency
        description: "Media agency acting on behalf of the advertiser (trimmed)."
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_streaming_play_events
    description: "Streaming play events from the MediaCo Streaming platform. Grain: 1 row per event_id."
    columns:
      - name: event_id
        description: "Unique identifier for the play event."
        tests:
          - not_null
          - unique
      - name: event_timestamp
        description: "Timestamp when the event occurred."
        tests:
          - not_null
      - name: user_id
        description: "Identifier for the user who triggered the event."
      - name: session_id
        description: "Reference to the viewing session containing this event."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_streaming_sessions')
                field: session_id
      - name: programme_id
        description: "Reference to the programme being viewed."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_programmes')
                field: programme_id
      - name: episode_id
        description: "Identifier for the specific episode being viewed."
      - name: event_type
        description: "Type of play event (e.g. play, pause, complete)."
        tests:
          - not_null
      - name: position_sec
        description: "Playback position in seconds when the event fired."
      - name: platform
        description: "Platform on which the event occurred (e.g. web, ios, android, ctv)."
        tests:
          - not_null
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_streaming_sessions
    description: "Viewing sessions on the MediaCo Streaming streaming platform. Grain: 1 row per session_id."
    columns:
      - name: session_id
        description: "Unique identifier for the viewing session."
        tests:
          - not_null
          - unique
      - name: user_id
        description: "Reference to the user who initiated the session."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_streaming_users')
                field: user_id
      - name: session_start
        description: "Timestamp when the session started."
        tests:
          - not_null
      - name: session_end
        description: "Timestamp when the session ended."
      - name: platform
        description: "Platform on which the session occurred."
        tests:
          - not_null
      - name: device_type
        description: "Type of device used for the session."
      - name: country
        description: "Country from which the session originated."
      - name: is_new_user
        description: "Flag indicating whether this session belongs to a new user."
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_streaming_users
    description: "Registered MediaCo Streaming user accounts. Grain: 1 row per user_id."
    columns:
      - name: user_id
        description: "Unique identifier for the registered user."
        tests:
          - not_null
          - unique
      - name: registration_date
        description: "Date on which the user registered."
        tests:
          - not_null
      - name: demographic_id
        description: "Reference to the user's demographic segment."
        tests:
          - relationships:
              arguments:
                to: ref('stg_demographics')
                field: demographic_id
      - name: is_active
        description: "Flag indicating whether the user account is currently active."
        tests:
          - not_null
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_demographics
    description: "Demographic segment reference data used for audience classification. Grain: 1 row per demographic_id."
    columns:
      - name: demographic_id
        description: "Unique identifier for the demographic segment."
        tests:
          - not_null
          - unique
      - name: age_band
        description: "Age band for the demographic segment (e.g. 16-24, 25-34)."
        tests:
          - not_null
      - name: gender
        description: "Gender for the demographic segment."
        tests:
          - not_null
      - name: social_grade
        description: "Social grade classification (e.g. ABC1, C2DE)."
        tests:
          - not_null
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_dayparts
    description: "Daypart reference data defining broadcast time windows. Grain: 1 row per daypart_id."
    columns:
      - name: daypart_id
        description: "Unique identifier for the daypart."
        tests:
          - not_null
          - unique
      - name: daypart_name
        description: "Human-readable name for the daypart (e.g. breakfast, daytime, peak, late)."
        tests:
          - not_null
      - name: start_hour
        description: "Hour of day (0-23) at which the daypart begins."
        tests:
          - not_null
      - name: end_hour
        description: "Hour of day (0-23) at which the daypart ends."
        tests:
          - not_null
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."

  - name: stg_uk_population_baseline
    description: "UK 4+ population baseline by year and demographic. Used as denominator in TVR (CA-01) and reach percentage (CA-04) calculations. Fixed at ~63,000 thousands overall; split across demographics proportionally."
    columns:
      - name: year
        description: "Reference year for the population estimate."
        tests:
          - not_null
      - name: demographic_id
        description: "Reference to the demographic segment this population figure applies to."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_demographics')
                field: demographic_id
      - name: population_thousands
        description: "Population count in thousands for this year/demographic combination."
        tests:
          - not_null
      - name: _loaded_at
        description: "Timestamp when this row was loaded by the staging model."
