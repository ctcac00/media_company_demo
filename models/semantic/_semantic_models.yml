semantic_models:
  - name: sem_programme_audience_daily
    model: ref('fct_programme_audience_daily')
    description: "Semantic model for programme audience, TVR, share of viewing, and reach metrics."
    defaults:
      agg_time_dimension: metric_time

    entities:
      - name: programme_audience_daily_id
        type: primary
        expr: programme_audience_daily_id
      - name: programme_id
        type: foreign
        expr: programme_id
      - name: channel_id
        type: foreign
        expr: channel_id
      - name: demographic_id
        type: foreign
        expr: demographic_id

    dimensions:
      - name: metric_time
        type: time
        type_params:
          time_granularity: day
        expr: broadcast_date
      - name: broadcast_date
        type: time
        type_params:
          time_granularity: day
        expr: broadcast_date
      - name: is_media_company_portfolio
        type: categorical
        expr: is_media_company_portfolio
      - name: is_c7_consolidated
        type: categorical
        expr: is_c7_consolidated

    measures:
      - name: viewers_thousands_sum
        agg: sum
        expr: overnight_viewers_thousands
        description: "Sum of overnight viewers in thousands"
      - name: c7_viewers_thousands_sum
        agg: sum
        expr: c7_viewers_thousands
        description: "Sum of C7 consolidated viewers in thousands"
      - name: reach_15min_thousands_sum
        agg: sum
        expr: reach_15min_thousands
        description: "Sum of consecutive 15-min reach in thousands"
      - name: uk_population_thousands_const
        agg: max
        expr: "{{ var('uk_population_thousands') }}"
        description: "UK 4+ population constant (denominator for TVR). Uses MAX to avoid inflating the constant by row count."

  - name: sem_ad_revenue
    model: ref('fct_ad_revenue')
    description: "Semantic model for ad revenue, impressions, CPM, and spot delivery metrics."
    defaults:
      agg_time_dimension: metric_time

    entities:
      - name: ad_revenue_id
        type: primary
        expr: ad_revenue_id
      - name: advertiser_id
        type: foreign
        expr: advertiser_id
      - name: daypart_id
        type: foreign
        expr: daypart_id
      - name: channel_id
        type: foreign
        expr: channel_id

    dimensions:
      - name: metric_time
        type: time
        type_params:
          time_granularity: day
        expr: broadcast_date
      - name: broadcast_date
        type: time
        type_params:
          time_granularity: day
        expr: broadcast_date
      - name: platform
        type: categorical
        expr: platform

    measures:
      - name: total_revenue_gbp
        agg: sum
        expr: actual_revenue_gbp
        description: "Total gross ad revenue in GBP"
      - name: total_impressions_thousands
        agg: sum
        expr: impressions_thousands
        description: "Total delivered ad impressions in thousands"
      - name: booked_impressions_thousands_sum
        agg: sum
        expr: booked_impressions_thousands
        description: "Total booked ad impressions in thousands"
      - name: rate_card_cpm_avg
        agg: average
        expr: rate_card_cpm_gbp
        description: "Average rate-card CPM in GBP"

  - name: sem_streaming_engagement
    model: ref('fct_streaming_engagement')
    description: "Semantic model for MediaCo Streaming streaming engagement, MAU, completion rate."
    defaults:
      agg_time_dimension: metric_time

    entities:
      - name: streaming_engagement_id
        type: primary
        expr: streaming_engagement_id
      - name: programme_id
        type: foreign
        expr: programme_id
      - name: user_id
        type: foreign
        expr: user_id

    dimensions:
      - name: metric_time
        type: time
        type_params:
          time_granularity: day
        expr: broadcast_date
      - name: broadcast_date
        type: time
        type_params:
          time_granularity: day
        expr: broadcast_date
      - name: platform
        type: categorical
        expr: platform
      - name: device_type
        type: categorical
        expr: device_type
      - name: is_new_user
        type: categorical
        expr: is_new_user

    measures:
      - name: video_starts_sum
        agg: sum
        expr: video_starts
        description: "Total video play starts"
      - name: video_completes_sum
        agg: sum
        expr: video_completes
        description: "Total video completions"
      - name: session_duration_min_avg
        agg: average
        expr: session_duration_min
        description: "Average session duration in minutes"
      - name: distinct_users_streaming
        agg: count_distinct
        expr: user_id
        description: "Count of distinct MediaCo Streaming users"

  - name: sem_audience_reach
    model: ref('fct_audience_reach_quarterly')
    description: "Semantic model for Ofcom-format quarterly audience reach metrics."
    defaults:
      agg_time_dimension: metric_time

    entities:
      - name: audience_reach_quarterly_id
        type: primary
        expr: audience_reach_quarterly_id
      - name: channel_id
        type: foreign
        expr: channel_id
      - name: demographic_id
        type: foreign
        expr: demographic_id

    dimensions:
      - name: metric_time
        type: time
        type_params:
          time_granularity: quarter
        expr: broadcast_quarter
      - name: broadcast_quarter
        type: categorical
        expr: broadcast_quarter
      - name: is_15min_consecutive
        type: categorical
        expr: is_15min_consecutive

    measures:
      - name: reach_thousands_sum
        agg: sum
        expr: reach_thousands
        description: "Total quarterly reach in thousands (consecutive 15-min)"

metrics:
  # ---------------------------------------------------------------------------
  # Content Performance
  # ---------------------------------------------------------------------------

  # Helper simple metrics for tvr ratio
  - name: share_of_viewing
    label: "Overnight Viewers (thousands)"
    description: "Sum of overnight viewers in thousands — used as TVR numerator and as share-of-viewing input (CA-03)"
    type: simple
    type_params:
      measure: viewers_thousands_sum

  - name: uk_population_metric
    label: "UK 4+ Population (thousands)"
    description: "UK 4+ population constant in thousands — helper denominator for TVR ratio"
    type: simple
    type_params:
      measure: uk_population_thousands_const

  # tvr references simple metrics, not measures (required by MetricFlow 1.6+)
  - name: tvr
    label: "TVR"
    description: "Television Rating — overnight viewers as a proportion of UK 4+ population (CA-01). Multiply by 100 in your BI tool for a percentage."
    type: ratio
    type_params:
      numerator:
        name: share_of_viewing
      denominator:
        name: uk_population_metric

  - name: consolidated_7day_viewers
    label: "C7 Viewers (thousands)"
    description: "Consolidated 7-day (C7) viewers in thousands (CA-02)"
    type: simple
    type_params:
      measure: c7_viewers_thousands_sum

  - name: reach_15min_consecutive
    label: "Quarterly Reach — 15-min consecutive (thousands)"
    description: "Quarterly reach: distinct viewers with consecutive 15-min viewing in thousands (CA-04)"
    type: simple
    type_params:
      measure: reach_thousands_sum

  # ---------------------------------------------------------------------------
  # Advertising
  # ---------------------------------------------------------------------------

  - name: total_ad_revenue_gbp
    label: "Total Ad Revenue (GBP)"
    description: "Total gross advertising revenue in GBP (linear + AVOD combined) (CA-05)"
    type: simple
    type_params:
      measure: total_revenue_gbp

  - name: ad_impressions
    label: "Ad Impressions (thousands)"
    description: "Total delivered ad impressions in thousands"
    type: simple
    type_params:
      measure: total_impressions_thousands

  - name: rate_card_cpm_gbp
    label: "Rate-Card CPM (GBP)"
    description: "Average rate-card CPM in GBP — baseline pricing before discounts"
    type: simple
    type_params:
      measure: rate_card_cpm_avg

  # realised_cpm_gbp references simple metrics, not measures
  - name: realised_cpm_gbp
    label: "Realised CPM (GBP)"
    description: "Realised CPM = total revenue / impressions (CA-06). Derived from simple metrics per MetricFlow 1.6+ requirement."
    type: derived
    type_params:
      expr: "total_ad_revenue_gbp / ad_impressions"
      metrics:
        - name: total_ad_revenue_gbp
        - name: ad_impressions

  # Helper simple metric for spot_delivery_ratio denominator
  - name: booked_impressions_metric
    label: "Booked Impressions (thousands)"
    description: "Total booked ad impressions in thousands — helper denominator for spot delivery ratio"
    type: simple
    type_params:
      measure: booked_impressions_thousands_sum

  # spot_delivery_ratio references simple metrics, not measures
  - name: spot_delivery_ratio
    label: "Spot Delivery Ratio"
    description: "Delivered impressions / booked impressions (CA-07)"
    type: ratio
    type_params:
      numerator:
        name: ad_impressions
      denominator:
        name: booked_impressions_metric

  # ---------------------------------------------------------------------------
  # Digital / MediaCo Streaming
  # ---------------------------------------------------------------------------

  - name: streaming_mau
    label: "MediaCo Streaming MAU"
    description: "MediaCo Streaming Monthly Active Users — distinct users with a play event in the rolling 30 days (CA-08)"
    type: simple
    type_params:
      measure: distinct_users_streaming

  - name: streaming_wau
    label: "MediaCo Streaming WAU"
    description: "MediaCo Streaming Weekly Active Users — distinct users with a play event in the rolling 7 days"
    type: simple
    type_params:
      measure: distinct_users_streaming

  - name: streaming_dau
    label: "MediaCo Streaming DAU"
    description: "MediaCo Streaming Daily Active Users — distinct users with a play event on a given day"
    type: simple
    type_params:
      measure: distinct_users_streaming

  # Helper simple metrics for video_completion_rate derived metric
  - name: video_completes_metric
    label: "Video Completions"
    description: "Total video completions — helper metric for video_completion_rate"
    type: simple
    type_params:
      measure: video_completes_sum

  - name: video_starts_metric
    label: "Video Starts"
    description: "Total video play starts — helper metric for video_completion_rate"
    type: simple
    type_params:
      measure: video_starts_sum

  # video_completion_rate references simple metrics, not measures
  - name: video_completion_rate
    label: "Video Completion Rate"
    description: "Video completion rate = completes / starts (CA-09). Derived from simple metrics per MetricFlow 1.6+ requirement."
    type: derived
    type_params:
      expr: "video_completes_metric / video_starts_metric"
      metrics:
        - name: video_completes_metric
        - name: video_starts_metric

  - name: avg_session_duration_min
    label: "Avg Session Duration (min)"
    description: "Average MediaCo Streaming session duration in minutes"
    type: simple
    type_params:
      measure: session_duration_min_avg
