name: "media_company_demo"
version: "1.0.0"
config-version: 2

profile: "media_company_demo"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  source_database: "CCASTRO_SANDBOX"
  source_schema_prefix: "dbt_media_company_demo_source"
  underdelivery_threshold: 0.95
  uk_population_thousands: 63000

models:
  media_company_demo:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  media_company_demo:
    +schema: dbt_media_company_demo_source
    +quote_columns: false
